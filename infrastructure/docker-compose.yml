name: ai-marketing-manager

# Local development dependencies only — never used for staging/production, which target
# managed AWS services (RDS PostgreSQL, ElastiCache Redis) per ADR-006-CLOUD.md. Actual
# Terraform for those is out of scope for Phase 1 ("do not create production AWS
# infrastructure yet").
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_only
      POSTGRES_DB: ai_marketing_manager
    ports:
      # Mapped to a non-default host port to avoid clashing with a locally installed
      # PostgreSQL service. Update DATABASE_URL to match if you change this.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_marketing_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
