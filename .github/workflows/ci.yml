name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_ENV: local
  DATABASE_URL: postgresql://app:app_ci_only@localhost:5432/ai_marketing_manager
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000
  CORS_ORIGIN: http://localhost:3000
  # Non-key-shaped placeholders (never real credentials — see .env.example): sufficient
  # for `next build`, which never executes clerkMiddleware(). The E2E step below needs a
  # shape-valid fixture instead (live request-serving fatally validates key format) —
  # computed at runtime in its own step so no key-shaped literal is ever committed.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: replace-with-real-clerk-publishable-key
  CLERK_SECRET_KEY: replace-with-real-clerk-secret-key

jobs:
  # Each pipeline stage from the Phase 1 task's required list is its own job step below,
  # run in order on a single runner so a failure in any required stage fails the whole
  # workflow (per "CI must fail when a required stage fails" / "no deployment workflows yet").
  ci:
    name: install -> lint -> typecheck -> unit -> integration -> build -> e2e -> secret scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
          POSTGRES_DB: ai_marketing_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_marketing_manager"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git history for secret scan
        run: git fetch --unshallow || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      - name: Build web (Next.js production build)
        run: pnpm --filter @ai-marketing-manager/web run build

      - name: Prepare fixture-only Clerk keys for E2E
        # No real Clerk application exists in this project yet (docs/identity/phase-2-2-implementation-report.md) —
        # computed at runtime, never committed, so no key-shaped literal ever lands in a
        # tracked file. Shape-valid (satisfies @clerk/nextjs's fatal format check on every
        # live request) but 100% non-functional: pk_live_ avoids Clerk's dev-instance
        # cross-origin handshake redirect (which needs a real reachable Frontend API
        # domain), and the decoded domain does not exist. See tests/e2e/fixtures.ts for
        # how E2E tests block requests to that domain instead of letting them hang.
        run: |
          node -e "
            const domain = 'fake-live-test.example.com';
            const pub = 'pk_live_' + Buffer.from(domain + '\$').toString('base64').replace(/=+\$/, '');
            const secretSuffix = Array.from({ length: 40 }, () => Math.floor(Math.random() * 36).toString(36)).join('');
            console.log('NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=' + pub);
            console.log('CLERK_SECRET_KEY=sk_live_fixture_' + secretSuffix);
          " >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: pnpm run test:e2e:install

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high
