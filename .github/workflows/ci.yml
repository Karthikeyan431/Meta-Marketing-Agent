name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_ENV: local
  DATABASE_URL: postgresql://app:app_ci_only@localhost:5432/ai_marketing_manager
  REDIS_URL: redis://localhost:6379
  NEXT_PUBLIC_API_URL: http://localhost:4000
  CORS_ORIGIN: http://localhost:3000

jobs:
  # Each pipeline stage from the Phase 1 task's required list is its own job step below,
  # run in order on a single runner so a failure in any required stage fails the whole
  # workflow (per "CI must fail when a required stage fails" / "no deployment workflows yet").
  ci:
    name: install -> lint -> typecheck -> unit -> integration -> build -> e2e -> secret scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
          POSTGRES_DB: ai_marketing_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_marketing_manager"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git history for secret scan
        run: git fetch --unshallow || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      - name: Build web (Next.js production build)
        run: pnpm --filter @ai-marketing-manager/web run build

      - name: Install Playwright browsers
        run: pnpm run test:e2e:install

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high
